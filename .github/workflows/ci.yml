name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm run build
        env:
          # Provide dummy values so the build doesn't fail due to missing env vars.
          # Real values are configured in Cloudflare Pages dashboard.
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY || 'ci-placeholder' }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY || 'ci-placeholder' }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID || 'ci-placeholder' }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm run test:e2e
        env:
          PUBLIC_WEB3FORMS_KEY: ci-placeholder
          MAILERLITE_API_KEY: ci-placeholder
          MAILERLITE_GROUP_ID: ci-placeholder

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
